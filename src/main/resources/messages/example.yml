# ================================================================ #
#       HELPFUL RESOURCES IF YOU WANT TO GO ADVANCED STUFF         #
# ================================================================ #

# DISCORD API DOCS:
# Official Discord Webhook docs (what fields are allowed)
# https://discord.com/developers/docs/resources/webhook#execute-webhook
#
# Embed structure reference (titles, fields, colors, limits, etc.)
# https://discord.com/developers/docs/resources/channel#embed-object
#
# Allowed mentions (how pings are controlled)
# https://discord.com/developers/docs/resources/channel#allowed-mentions-object
#
# Components (buttons, action rows)
# https://discord.com/developers/docs/interactions/message-components

# ----------------------------------------------------------------------------- #

# NOTE: THE PLUGIN DOES NOT SUPPORT ATTACHMENTS AT THE MOMENT.
# ONLY 1 embed is supported per msg.
# This file gets converted straight into JSON by the plugin.
# That means you COULD reverse engineer that to go beyond the plugin's limits.
# BUT NOTHING is GUARANTEED.


plugin:
  # Which Webhook to USE to SEND this?
  # NAME OF IT FROM CONFIG NOT THE URL
  webhook: "nothing"

# THIS IS FROM WHERE THE PLUGIN STARTS CONVERTING THIS INTO JSON.
# IT ONLY CONVERTS THIS KEY.
discord-webhook:
  # ===============================
  # BASIC MESSAGE TEXT
  # ===============================
  
  # The main text of the message.
  # This is what people will actually read.
  # Max 2000 characters.
  content: "Hello from the server 👋"
  
  # Optional: change the name shown for THIS message only.
  # Does NOT change the webhook permanently.
  username: "Hello World"
  
  # Optional: change the avatar image for THIS message only.
  # Must be a direct image URL (png/jpg/gif).
  avatar_url: "https://example.com/icon.png"
  
  # Text-to-speech.
  # If true, Discord may read the message out loud.
  # Most servers hate this. Leave false.
  tts: false
  
  
  # ===============================
  # EMBEDS (FANCY BOXES)
  # ===============================
  
  # Embeds are the rich-looking boxes with titles, colors, fields, etc.
  embeds:
    - # The big bold title at the top of the embed
      title: "Server Status"
      
      # The main text inside the embed
      description: "Everything is running smoothly"
      
      # Makes the title clickable
      url: "https://inds.space"
      
      # Time shown on the embed (ISO format)
      # Example: 2026-01-11T15:04:05Z
      timestamp: "2026-01-11T15:04:05Z"
      
      # Embed color (NUMBER, not hex)
      # Example: green = 3066993, red = 15158332
      color: 3066993
      
      # Small text at the bottom of the embed
      footer:
        text: "IND’s Server Network"
        icon_url: "https://example.com/icon.png"
      
      # Big image shown below the embed text
      image:
        url: "https://example.com/banner.png"
      
      # Small image shown on the right side
      thumbnail:
        url: "https://example.com/icon.png"
      
      # Author section at the top (optional)
      author:
        name: "Server Core"
        url: "https://inds.space"
        icon_url: "https://example.com/icon.png"
      
      # Small name/value rows inside the embed
      # You can have up to 25 fields
      fields:
        - name: "TPS"
          value: "20.0"
          inline: true
        
        - name: "Players"
          value: "3 / 50"
          inline: true
  
  
  # ===============================
  # MENTIONS CONTROL (DISABLED BY DEFAULT) You may enable it though.
  # ===============================
  
  # Controls who can be pinged.
  # This prevents accidental @everyone disasters.
  #allowed_mentions:
    # Empty list = no automatic pings
    #parse: []
    
    # Allow pings for specific users (by ID)
    #users: []
    
    # Allow pings for specific roles (by ID)
    #roles: []
  
  
  # ===============================
  # BUTTONS (OPTIONAL)
  # ===============================
  
  # Components are interactive elements like buttons.
  # You usually only need to LINK buttons.
  components:
    - # Action row (required wrapper)
      type: 1
      components:
        - # Button
          type: 2
          
          # Button style
          # 5 = link button (safest)
          style: 5
          
          # Text shown on the button
          label: "Open Dashboard"
          
          # Where the button sends the user
          url: "https://inds.space"
